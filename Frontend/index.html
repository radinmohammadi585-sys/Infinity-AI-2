<!DOCTYPE html>
<html lang="fa" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Infinity AI 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#070b16;--fg:#f1f5f9;--muted:#94a3b8;--card:rgba(17,24,39,.82);
  --line:rgba(148,163,184,.18);--accent:#818cf8;--accent2:#6366f1;
  --glow:rgba(99,102,241,.35);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;display:flex;color:var(--fg);
  font-family:"Vazirmatn","Inter",system-ui,sans-serif;font-size:15px;line-height:1.7;
  background:
    radial-gradient(900px 500px at 10% -10%,rgba(99,102,241,.28),transparent 60%),
    radial-gradient(700px 400px at 100% 0%,rgba(14,165,233,.18),transparent 55%),
    var(--bg);
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.4;
  background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:28px 28px;animation:drift 40s linear infinite;
}
@keyframes drift{to{background-position:28px 28px}}
.nav{
  width:232px;padding:16px 12px;display:flex;flex-direction:column;gap:6px;
  background:rgba(15,23,42,.75);backdrop-filter:blur(16px);
  border-inline-end:1px solid var(--line);z-index:2;
}
.brand{font-weight:800;font-size:18px;padding:8px 12px 14px;letter-spacing:.02em}
.nav button{
  display:flex;align-items:center;gap:10px;border:0;cursor:pointer;text-align:start;
  background:transparent;color:var(--fg);padding:12px 14px;border-radius:14px;
  font-family:inherit;font-size:14px;font-weight:500;transition:background .2s,transform .15s;
}
.nav button:hover{background:rgba(129,140,248,.12);transform:translateX(-2px)}
.nav button.on{background:linear-gradient(135deg,rgba(99,102,241,.35),rgba(14,165,233,.15));box-shadow:0 0 0 1px rgba(129,140,248,.25)}
.main{flex:1;display:flex;flex-direction:column;min-width:0;z-index:1}
.top{
  padding:12px 18px;border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:rgba(7,11,22,.55);backdrop-filter:blur(10px);
}
.top select{
  font-family:inherit;border-radius:12px;border:1px solid var(--line);
  background:rgba(15,23,42,.9);color:var(--fg);padding:8px 10px;
}
.page{display:none;padding:20px;flex:1;overflow:auto;animation:fadeIn .35s ease}
.page.on{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;
  backdrop-filter:blur(12px);transition:transform .2s,box-shadow .2s,border-color .2s;
  animation:fadeIn .45s ease both;
}
.card:nth-child(2){animation-delay:.05s}.card:nth-child(3){animation-delay:.1s}.card:nth-child(4){animation-delay:.15s}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 40px var(--glow);border-color:rgba(129,140,248,.4)}
h2{margin:0 0 8px;font-size:clamp(20px,2.5vw,28px);font-weight:800}
.muted{color:var(--muted)}
.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 72px);max-width:900px;margin:0 auto}
#log{flex:1;overflow:auto;padding:8px 4px}
.msg{
  max-width:85%;margin:8px 0;padding:12px 16px;border-radius:18px;white-space:pre-wrap;
  animation:msgIn .28s ease;
}
@keyframes msgIn{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
.user{margin-inline-start:auto;background:linear-gradient(135deg,rgba(99,102,241,.4),rgba(14,165,233,.25))}
.bot{margin-inline-end:auto;background:rgba(15,23,42,.9);border:1px solid var(--line)}
.composer{display:flex;gap:8px;padding:10px 0}
.composer input{
  flex:1;border-radius:999px;border:1px solid var(--line);background:rgba(15,23,42,.9);
  color:var(--fg);padding:14px 18px;font-family:inherit;font-size:15px;outline:none;
  transition:border-color .2s,box-shadow .2s;
}
.composer input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(129,140,248,.2)}
.composer button{
  border:0;border-radius:999px;padding:0 20px;cursor:pointer;font-family:inherit;font-weight:700;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
  transition:transform .15s,filter .15s;
}
.composer button:hover{filter:brightness(1.08);transform:scale(1.02)}
.composer button:active{transform:scale(.98)}
.thinking{display:none;align-items:center;justify-content:center;margin:10px auto;width:112px;height:44px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04)}
.thinking.on{display:flex}
.thinking .d{width:9px;height:9px;margin:0 5px;border-radius:50%;animation:td 1.1s infinite ease-in-out}
.thinking .d:nth-child(1){animation-delay:0s}.thinking .d:nth-child(2){animation-delay:.15s}.thinking .d:nth-child(3){animation-delay:.3s}
@keyframes td{0%{background:#3b82f6;opacity:.5}33%{background:#22c55e;transform:translateY(-4px);opacity:1}66%{background:#ef4444}100%{background:#3b82f6;opacity:.5}}
.bottom{display:none;position:fixed;bottom:0;left:0;right:0;z-index:5;background:rgba(15,23,42,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line);justify-content:space-around;padding:8px}
.bottom button{background:transparent;border:0;color:var(--fg);font-size:20px;padding:8px 12px;cursor:pointer;border-radius:12px;transition:background .2s}
.bottom button:hover,.bottom button.on{background:rgba(129,140,248,.2)}
table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid var(--line);text-align:start;font-size:14px}
textarea{width:100%;border-radius:14px;border:1px solid var(--line);background:rgba(15,23,42,.85);color:var(--fg);padding:12px;font-family:inherit}
@media(max-width:800px){
  .nav{display:none}.bottom{display:flex}.page{padding:16px 14px 80px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<nav class="nav">
  <div class="brand">Infinity AI 2</div>
  <button type="button" class="on" data-p="home">⌂ خانه</button>
  <button type="button" data-p="chat">💬 چت هوش مصنوعی</button>
  <button type="button" data-p="classes">🎓 کلاس آنلاین</button>
  <button type="button" data-p="support">🛠 پشتیبانی</button>
  <button type="button" data-p="stock">📈 بورس اینفینیتی</button>
  <button type="button" data-p="store">🛒 فروشگاه اینفینیتی</button>
</nav>
<div class="main">
  <div class="top">
    <span id="title" style="font-weight:700">خانه</span>
    <select id="langSel" aria-label="زبان"></select>
  </div>
  <section class="page on" id="page-home">
    <h2>به Infinity AI 2 خوش آمدید</h2>
    <p class="muted">چت، کلاس، پشتیبانی، بورس و فروشگاه — سریع و سبک.</p>
    <div class="cards">
      <div class="card">چت AI</div><div class="card">کلاس</div><div class="card">بورس</div><div class="card">فروشگاه</div>
    </div>
  </section>
  <section class="page" id="page-chat">
    <div class="chat-wrap">
      <div id="log"></div>
      <div class="thinking" id="thinking"><span class="d"></span><span class="d"></span><span class="d"></span></div>
      <div class="composer"><input id="inp" placeholder="پیام…"/><button type="button" id="send">ارسال</button></div>
      <label class="muted" style="font-size:12px"><input type="checkbox" id="useBridge" checked/> پل به بقیه پروژه‌ها</label>
    </div>
  </section>
  <section class="page" id="page-classes">
    <h2>کلاس‌های آنلاین</h2>
    <p class="muted">نسخه سبک پلتفرم</p>
    <div class="card" id="classBox">به‌زودی از سرور</div>
  </section>
  <section class="page" id="page-support">
    <h2>پشتیبانی</h2>
    <div class="card">
      <textarea id="sup" rows="4" placeholder="پیام پشتیبانی…"></textarea>
      <button type="button" id="supBtn" style="margin-top:10px;border:0;border-radius:12px;padding:10px 16px;background:var(--accent2);color:#fff;font-family:inherit;font-weight:700;cursor:pointer">ارسال</button>
      <div id="supMsg" class="muted"></div>
    </div>
  </section>
  <section class="page" id="page-stock"><h2>بورس اینفینیتی</h2><div id="stockBox" class="card">…</div></section>
  <section class="page" id="page-store"><h2>فروشگاه اینفینیتی</h2><div id="storeBox" class="cards"></div></section>
</div>
<div class="bottom" id="bottom">
  <button type="button" data-p="home">⌂</button>
  <button type="button" data-p="chat">💬</button>
  <button type="button" data-p="classes">🎓</button>
  <button type="button" data-p="support">🛠</button>
  <button type="button" data-p="stock">📈</button>
  <button type="button" data-p="store">🛒</button>
</div>
<script>
const API = localStorage.getItem('BACKEND_URL') || '';
const RTL = new Set(['fa','ar','ur','he','ps']);
const titles = {home:'خانه',chat:'چت هوش مصنوعی',classes:'کلاس آنلاین',support:'پشتیبانی',stock:'بورس اینفینیتی',store:'فروشگاه اینفینیتی'};
const titlesEn = {home:'Home',chat:'AI Chat',classes:'Classes',support:'Support',stock:'Stock',store:'Store'};
const log = document.getElementById('log');
const thinking = document.getElementById('thinking');
const inp = document.getElementById('inp');
const langSel = document.getElementById('langSel');

function go(p){
  document.querySelectorAll('.page').forEach(x => x.classList.remove('on'));
  const page = document.getElementById('page-'+p);
  if (page) page.classList.add('on');
  const fa = htmlRoot.dir === 'rtl';
  document.getElementById('title').textContent = (fa ? titles : titlesEn)[p] || p;
  document.querySelectorAll('[data-p]').forEach(b => b.classList.toggle('on', b.dataset.p === p));
  if (p === 'stock') loadStock();
  if (p === 'store') loadStore();
}
document.querySelectorAll('[data-p]').forEach(b => b.addEventListener('click', () => go(b.dataset.p)));

function add(c,t){
  const d = document.createElement('div');
  d.className = 'msg '+c;
  d.textContent = t;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}
async function send(){
  const t = (inp.value || '').trim();
  if (!t) return;
  inp.value = '';
  add('user', t);
  thinking.classList.add('on');
  try {
    const r = await fetch(API + '/api/chat', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({message:t, bridge: document.getElementById('useBridge').checked})
    });
    const j = await r.json();
    add('bot', j.reply || JSON.stringify(j));
  } catch(e) {
    add('bot', 'خطای اتصال به سرور');
  } finally {
    thinking.classList.remove('on');
  }
}
document.getElementById('send').onclick = send;
inp.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

async function loadStock(){
  try {
    const j = await (await fetch(API + '/api/stock')).json();
    let h = '<table><tr><th>نماد</th><th>قیمت</th></tr>';
    (j.symbols || []).forEach(s => { h += '<tr><td>'+s.id+'</td><td>'+s.price+'</td></tr>'; });
    h += '</table>';
    document.getElementById('stockBox').innerHTML = h;
  } catch(e) { document.getElementById('stockBox').textContent = 'خطا در بارگذاری'; }
}
async function loadStore(){
  try {
    const j = await (await fetch(API + '/api/store')).json();
    document.getElementById('storeBox').innerHTML = (j.items||[]).map(i =>
      '<div class="card"><b>'+i.title+'</b><div class="muted">'+i.price+'</div></div>'
    ).join('') || '<div class="muted">خالی</div>';
  } catch(e) {}
}
document.getElementById('supBtn').onclick = () => {
  document.getElementById('supMsg').textContent = 'پیام پشتیبانی ثبت شد.';
};

const LAB = {fa:'فارسی',en:'English',ar:'العربية',tr:'Türkçe',de:'Deutsch',fr:'Français',es:'Español',ru:'Русский',zh:'中文',ja:'日本語'};
['fa','en','ar','tr','de','fr','es','ru','zh','ja'].forEach(c => {
  const o = document.createElement('option');
  o.value = c; o.textContent = (LAB[c]||c) + ' — ' + c;
  langSel.appendChild(o);
});
langSel.value = 'fa';
langSel.onchange = () => {
  const c = langSel.value;
  htmlRoot.dir = RTL.has(c) ? 'rtl' : 'ltr';
  htmlRoot.lang = c;
};
</script>
</body>
</html>
